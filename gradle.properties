# Project-wide Gradle settings for Aura Weather.

# JVM heap and encoding used by the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable the Gradle daemon, parallel project execution, and build caching
# for faster local and CI builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Use AndroidX libraries instead of the legacy Support Library.
android.useAndroidX=true

# Kotlin code style used by IDE formatters/inspections for this project.
kotlin.code.style=official
